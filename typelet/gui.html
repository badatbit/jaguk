<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>jaguk gui</title>
<style>
  :root {
    --bg: #17181c; --panel: #1e2026; --line: #2c2f38; --fg: #d6d9e0;
    --dim: #8b90a0; --accent: #58a6ff; --crop: #ff3dae; --text: #ffffff;
    --src: #00c8ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.5 "Malgun Gothic", sans-serif; height: 100vh;
         display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header .title { font-weight: bold; color: var(--accent); }
  header .file { color: var(--dim); overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; flex: 1; }
  .modes button { background: none; border: 1px solid var(--line);
                  color: var(--dim); padding: 4px 10px; cursor: pointer; }
  .modes button.on { color: var(--fg); border-color: var(--accent);
                     background: #24344d; }
  main { flex: 1; display: flex; min-height: 0; }
  #tree { width: 300px; overflow-y: auto; background: var(--panel);
          border-right: 1px solid var(--line); padding: 8px 0; }
  #tree .group { padding: 5px 12px; cursor: pointer; font-weight: bold;
                 border-left: 3px solid transparent; }
  #tree .group:hover { background: #262a33; }
  #tree .group.active { background: #1b2740; color: var(--accent);
                        border-left-color: var(--accent); }
  #tree .group .n { color: var(--dim); font-weight: normal; }
  #tree .item { padding: 3px 12px 3px 26px; cursor: pointer; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  #tree .item:hover { background: #262a33; color: var(--fg); }
  #tree .item.sel { background: #24344d; color: var(--fg); }
  #tree .item .ko { color: var(--accent); }
  #tree .item .undecided { color: var(--dim); font-size: 10px;
                           border: 1px solid var(--dim); border-radius: 3px;
                           padding: 0 4px; }
  #tree .sect { padding: 8px 12px 2px; color: var(--dim); font-size: 11px;
                text-transform: uppercase; letter-spacing: .08em; }
  #view { flex: 1; overflow: auto; padding: 24px;
          background: repeating-conic-gradient(#202228 0 25%, #191b20 0 50%)
                      0 0 / 24px 24px; }
  #stage { position: relative; display: inline-block; }
  /* 이미지 바운드리 — outline 은 레이아웃을 밀지 않아 상자 좌표가 안 어긋난다.
     투명 스프라이트에서 캔버스 경계가 보이도록 항상 그린다. */
  #stage img { display: block; image-rendering: pixelated;
               outline: 1px solid rgba(110, 168, 255, .55); }
  .box { position: absolute; cursor: pointer; }
  .box.crop { border: 1px solid var(--crop); }
  .box.text { border: 1px dashed var(--text); }
  .box.src  { border: 1px solid var(--src); }
  .box.err  { border: 1px dashed #ff5340; }
  .box.err .tag { color: #ff8a7a; }
  .box.sel  { outline: 2px solid var(--accent); }
  /* 투명 히트 영역 — 테두리 없이 클릭만. 호버 시 살짝 비친다 */
  .box.hit  { background: transparent; }
  .box.hit:hover { background: rgba(90,200,255,.14);
                   outline: 1px dashed rgba(90,200,255,.5); }
  .handle { position: absolute; width: 8px; height: 8px; z-index: 5;
            background: var(--accent); border: 1px solid #0c1420; }
  .handle.rot { width: 10px; height: 10px; background: #ffcc44; }
  .box .tag { position: absolute; top: -16px; left: -1px; font-size: 10px;
              background: rgba(0,0,0,.75); padding: 0 4px; white-space: nowrap; }
  #props { width: 420px; overflow-y: auto; background: var(--panel);
           border-left: 1px solid var(--line); padding: 10px; }
  #props h3 { margin: 14px 0 6px; font-size: 12px; color: var(--accent);
              border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  #props h3:first-child { margin-top: 0; }
  #props table { width: 100%; border-collapse: collapse; }
  #props td { padding: 2px 4px; vertical-align: top; word-break: break-all; }
  #props td.k { color: var(--dim); width: 118px; }
  #props .empty { color: var(--dim); padding: 20px 6px; }
  .zoom { margin-left: auto; display: flex; gap: 4px; }
  .zoom button { background: none; border: 1px solid var(--line);
                 color: var(--dim); width: 26px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <span class="title">jaguk</span>
  <span class="modes" id="bases"></span>
  <span style="color:var(--line)">|</span>
  <span class="modes" id="overlays"></span>
  <span style="color:var(--line)">|</span>
  <span class="modes" id="compare"></span>
  <input type="range" id="alphaSlider" min="0" max="100" value="50"
         style="width:90px;display:none"
         title="왼쪽: 원본만 · 중간: 원본에 텍스트 덧쓰기 · 오른쪽: injected 교체"
         oninput="if (Math.abs(this.value - 50) <= 4) this.value = 50;
                  overlayAlpha=this.value/100;
                  applyOverlayAlpha();
                  saveState();">
  <span class="file" id="curfile">파일을 선택하세요</span>
  <span class="zoom">
    <span class="modes" id="bgButtons"></span>
    <input type="color" id="bgColor" value="#3c5a82" hidden
           oninput="pickBg(this.value)">
    <button onclick="setZoom(zoom/2)">−</button>
    <button onclick="setZoom(1)" title="이미지 1px = 화면(디바이스) 1px">1x</button>
    <button onclick="setZoom(zoom*2)">＋</button>
  </span>
</header>
<main>
  <nav id="tree">불러오는 중…</nav>
  <section id="view"><div id="stage"></div></section>
  <aside id="props"><div class="empty">이미지 위 상자 영역을 클릭하면 속성이
    표시됩니다. (테두리를 보려면 crop-box / text-box 토글)</div></aside>
</main>
<script>
const BASES = {"원본": "original", "erased": "erased", "injected": "injected"};
let base = "원본";
let overlays = {"crop-box": false, "text-box": false};   // 베이스와 독립 토글
let syncBoxes = true;            // 켜면 상자 편집 시 crop·text·source 동기화 (기본 ON)
// 비교 보기: "" 단독 | "overlay" 겹침 | "v" 상하 | "h" 좌우 (원본 + injected)
const COMPARE = {"겹침": "overlay", "상하": "v", "좌우": "h"};
let compare = "", overlayAlpha = 0.5;   // 겹침 기본 = 중간 (원본에 텍스트 덧쓰기)
let detail = null, zoom = 1, selected = null;
let currentGroup = null;         // 열려 있는 overlay 그룹명 (공유 base 구분)

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

async function loadTree() {
  const tree = await (await fetch("/api/tree")).json();
  const nav = document.getElementById("tree");
  nav.textContent = "";
  if (tree.catalogs.length) nav.appendChild(el("div", "sect", "text-only"));
  for (const cat of tree.catalogs) {
    const group = el("div", "group");
    group.appendChild(document.createTextNode(cat.name + " "));
    group.appendChild(el("span", "n", `(${cat.count})`));
    const body = el("div");
    body.style.display = "none";
    group.onclick = () =>
      body.style.display = body.style.display === "none" ? "" : "none";
    for (const entry of cat.entries) {
      const item = el("div", "item");
      item.dataset.file = entry.file;
      item.appendChild(document.createTextNode(entry.name.split(".")[0] + " "));
      item.appendChild(el("span", "ko", entry.ko || entry.jp));
      item.onclick = () => openFile(entry.file, item);
      body.appendChild(item);
    }
    nav.appendChild(group);
    nav.appendChild(body);
  }
  if ((tree.groups || []).length)
    nav.appendChild(el("div", "sect", "규칙 그룹"));
  const openFileName = detail && detail.file;   // 지금 열려 있는 파일
  for (const g of tree.groups || []) {
    const group = el("div", "group");
    group.dataset.group = g.name;
    group.appendChild(document.createTextNode(g.name + " "));
    group.appendChild(el("span", "n", `(${g.count} · ${g.mode})`));
    // 추출된 행이 하나도 없으면(=아직 손 안 댄 그룹) 그룹 이름 옆에 미정.
    // 개별 파일(특히 base)엔 미정을 안 붙인다 — 그룹 단위로 옮김.
    if (g.files.every(f => f.rows === 0))
      group.appendChild(el("span", "undecided", " 미정"));
    const body = el("div");
    // 지금 열린 파일이 속한 그룹은 강조 + 펼쳐 둔다
    const active = g.name === currentGroup;
    if (active) group.classList.add("active");
    body.style.display = active ? "" : "none";
    group.onclick = () =>
      body.style.display = body.style.display === "none" ? "" : "none";
    for (const f of g.files) {
      const item = el("div", "item", f.file.split("/").pop() + " ");
      if (f.rows > 0) item.appendChild(document.createTextNode(`(${f.rows})`));
      item.dataset.file = f.file;
      item.dataset.group = g.name;    // 공유 base 가 어느 그룹으로 열릴지
      if (active && f.file === openFileName) item.classList.add("sel");
      item.onclick = () => openFile(f.file, item, g.name);
      body.appendChild(item);
    }
    nav.appendChild(group);
    nav.appendChild(body);
  }
  if (tree.files.length) nav.appendChild(el("div", "sect", "파일 (행)"));
  for (const f of tree.files) {
    const item = el("div", "item", f.file + " ");
    item.appendChild(f.rows === 0 ? el("span", "undecided", "미정")
                                  : document.createTextNode(`(${f.rows})`));
    item.dataset.file = f.file;
    item.style.paddingLeft = "12px";
    item.onclick = () => openFile(f.file, item);
    nav.appendChild(item);
  }
}

function applyOverlayAlpha() {
  // 0~0.5: 원본 위에 글자 레이어 0→100%
  // 0.5~1: (원본+글자) ↔ injected 크로스페이드 — 오른쪽 끝 = injected 단독.
  // 투명 스프라이트에서도 성립하도록 아래층을 함께 꺼야 한다.
  const t = overlayAlpha;
  const fullIn = Math.max(0, t * 2 - 1);
  const base = document.getElementById("overlayBase");
  const text = document.getElementById("overlayText");
  const full = document.getElementById("overlayFull");
  if (base) base.style.opacity = 1 - fullIn;
  if (text) text.style.opacity = Math.min(1, t * 2) * (1 - fullIn);
  if (full) full.style.opacity = fullIn;
}

function renderModes() {
  const baseBar = document.getElementById("bases");
  baseBar.textContent = "";
  for (const name of Object.keys(BASES)) {
    const b = el("button", base === name ? "on" : "", name);
    b.onclick = () => { base = name; renderModes(); renderStage(); };
    baseBar.appendChild(b);
  }
  const overlayBar = document.getElementById("overlays");
  overlayBar.textContent = "";
  for (const name of Object.keys(overlays)) {
    const b = el("button", overlays[name] ? "on" : "", name);
    b.onclick = () => { overlays[name] = !overlays[name];
                        renderModes(); renderStage(); };
    overlayBar.appendChild(b);
  }
  // crop·text 동기화 토글 — 켜면 상자 하나를 옮길 때 셋(text·crop·source)이 함께
  const syncBtn = el("button", syncBoxes ? "on" : "", "동기화");
  syncBtn.title = "crop·text·source 상자를 한 몸으로 (편집 시 같이 이동)";
  syncBtn.onclick = () => { syncBoxes = !syncBoxes; renderModes(); };
  overlayBar.appendChild(syncBtn);
  // 현재 그룹의 상자들을 지금 즉시 동기화 (crop=text=source)
  const syncNow = el("button", "", "⇔ 전체 동기화");
  syncNow.title = "지금 이 그룹의 모든 상자를 text 기준으로 맞춘다";
  syncNow.onclick = async () => {
    busy("동기화 중…");
    finishOp(await postOp("/api/box/sync?path=" +
      encodeURIComponent(detail.file), {scope: "file"}), selected);
  };
  overlayBar.appendChild(syncNow);
  const compareBar = document.getElementById("compare");
  compareBar.textContent = "";
  for (const [name, value] of Object.entries(COMPARE)) {
    const b = el("button", compare === value ? "on" : "", name);
    b.title = "원본 + injected 비교 (" + name + ")";
    b.onclick = () => { compare = compare === value ? "" : value;
                        renderModes(); renderStage(); };
    compareBar.appendChild(b);
  }
  const slider = document.getElementById("alphaSlider");
  slider.style.display = compare === "overlay" ? "" : "none";
  slider.value = Math.round(overlayAlpha * 100);
  document.getElementById("bgColor").value = bgCustom;
}

async function openFile(file, item, group) {
  document.querySelectorAll("#tree .item.sel")
    .forEach(n => n.classList.remove("sel"));
  if (item) item.classList.add("sel");
  if (detail && detail.file !== file) styleEdits = {};   // 파일 바뀌면 편집 폐기
  currentGroup = group || null;        // 공유 base 를 어느 그룹으로 열지 기억
  renderEpoch++;                       // 이미지 URL 버전 — 메모리 캐시 무효화
  detail = await (await fetch("/api/file?path=" + encodeURIComponent(file) +
    (group ? "&group=" + encodeURIComponent(group) : ""))).json();
  if (detail.error || !detail.rows) {
    // 서버 에러를 화면에 그대로 — 구 서버 + 새 데이터 형식 등
    const stage = document.getElementById("stage");
    const pane = document.getElementById("props");
    stage.textContent = "";
    pane.textContent = "";
    pane.appendChild(banner(false,
      "❌ 서버 오류 — jaguk gui 재시작이 필요할 수 있습니다"));
    const pre = el("pre", "", detail.error || JSON.stringify(detail));
    pre.style.cssText = "white-space:pre-wrap;color:var(--dim);font-size:11px";
    pane.appendChild(pre);
    detail = null;
    return;
  }
  selected = null;
  currentGroup = detail.group || currentGroup;   // 서버가 해석한 실제 그룹
  document.getElementById("curfile").textContent = file;
  renderStage();
  renderProps();
  markActiveGroup();                    // 트리에서 이 파일의 그룹 강조 + 펼치기
}

// 지금 열린 파일이 속한 규칙 그룹을 트리에서 강조하고 펼친다 (그룹이 닫혀
// 있어도 어디에 속하는지 보이게). 열린 파일 항목도 sel 로 표시.
function markActiveGroup() {
  document.querySelectorAll("#tree .group.active")
    .forEach(g => g.classList.remove("active"));
  document.querySelectorAll("#tree .item.sel")
    .forEach(i => i.classList.remove("sel"));
  if (!currentGroup) return;
  const g = [...document.querySelectorAll("#tree .group")]
    .find(el => el.dataset.group === currentGroup);
  if (g) {
    g.classList.add("active");
    if (g.nextElementSibling) g.nextElementSibling.style.display = "";  // 펼치기
    g.scrollIntoView({block: "nearest"});
  }
  const openName = detail && detail.file;
  const it = [...document.querySelectorAll("#tree .item")].find(
    i => i.dataset.file === openName && i.dataset.group === currentGroup);
  if (it) it.classList.add("sel");
}

function setZoom(z) { zoom = Math.min(8, Math.max(0.25, z)); renderStage(); }

// 픽셀 정합: OS 배율(DPI)·브라우저 줌이 있으면 CSS 1px ≠ 디바이스 1px 이라
// 이미지가 비정수 배로 리샘플된다. devicePixelRatio 로 나눠 zoom 1x 에서
// 이미지 1px = 디바이스 1px 이 되게 한다 (줌 단계도 2배수라 항상 정수 배).
function pxScale() { return zoom / window.devicePixelRatio; }

const CHECKER =
  "repeating-conic-gradient(#202228 0 25%, #191b20 0 50%) 0 0 / 24px 24px";
// 배경 버튼 4개: 투명(체커) / 검정 / 흰색 / 커스텀(피커)
const BG_MODES = ["투명", "검정", "흰색", "커스텀"];
let bgIndex = 0, bgCustom = "#3c5a82";

function renderBgButtons() {
  const bar = document.getElementById("bgButtons");
  bar.textContent = "";
  BG_MODES.forEach((name, index) => {
    // 글자 없는 색 견본 버튼 — 커스텀만 'C'
    const b = el("button", bgIndex === index ? "on" : "", index === 3 ? "C" : "");
    b.style.width = "26px";
    b.style.height = "24px";
    b.title = `배경: ${name}`;
    if (index === 0)
      b.style.background =
        "repeating-conic-gradient(#3a3d46 0 25%, #23252c 0 50%) 0 0 / 10px 10px";
    if (index === 1) b.style.background = "#000";
    if (index === 2) b.style.background = "#fff";
    if (index === 3) {
      b.style.background = bgCustom;
      b.title = "배경: 커스텀 — 다시 클릭/우클릭: 색 선택";
      b.oncontextmenu = (ev) => { ev.preventDefault();
        document.getElementById("bgColor").click(); };
    }
    b.onclick = () => {
      if (index === 3 && bgIndex === 3) {      // 이미 커스텀이면 색 고르기
        document.getElementById("bgColor").click();
        return;
      }
      bgIndex = index;
      applyBg();
    };
    bar.appendChild(b);
  });
}

function applyBg() {
  document.getElementById("view").style.background =
    [CHECKER, "#000000", "#ffffff", bgCustom][bgIndex];
  renderBgButtons();
  if (typeof saveState === "function") saveState();
}
function pickBg(value) { bgCustom = value; bgIndex = 3; applyBg(); }

function boxDiv(cls, rect, label, onclick) {
  const [x, y, w, h] = rect;
  const div = el("div", "box " + cls);
  const s = pxScale();
  div.style.left = x * s + "px";
  div.style.top = y * s + "px";
  div.style.width = Math.max(1, w * s) + "px";
  div.style.height = Math.max(1, h * s) + "px";
  if (label) {
    const tag = el("span", "tag", label);
    div.appendChild(tag);
  }
  if (onclick) div.onclick = (ev) => { ev.stopPropagation(); onclick(); };
  return div;
}

function num(v) { const n = parseInt(v, 10); return isNaN(n) ? null : n; }

function rowRect(row, prefix) {
  const ks = prefix === "source"
    ? ["source_x", "source_y", "source_box_w", "source_box_h"]
    : [prefix + "_x", prefix + "_y", prefix + "_w", prefix + "_h"];
  const vals = ks.map(k => num(row[k]));
  return vals.some(v => v === null) ? null : vals;
}

function imgEl(kind, textLayer) {
  const img = document.createElement("img");
  // ?v= 는 openFile 마다 오른다 — 같은 URL 이면 브라우저가 no-store 를
  // 무시하고 메모리 캐시의 옛 비트맵을 재사용하는 것을 막는다 (저장 직후
  // 낡은 injected 가 보이던 문제). 순수 UI 재렌더는 같은 v 라 재요청 없음.
  let src = "/img/" + kind + "/" + detail.file + "?v=" + renderEpoch;
  if (detail.group) src += "&group=" + encodeURIComponent(detail.group);
  if (textLayer) src += "&layer=text";   // 글자 레이어만 (겹침 보기)
  // 저장 전 스타일 편집이 있으면 라이브 미리보기로 렌더
  if (kind === "injected" && Object.keys(styleEdits).length)
    src += "&styles=" + encodeURIComponent(JSON.stringify(styleEdits));
  img.src = src;
  if (detail.size) {
    // 로드 전에 최종 크기로 고정 — 로드 완료 때 튀는 재배치를 없앤다
    img.style.width = detail.size[0] * pxScale() + "px";
    img.style.height = detail.size[1] * pxScale() + "px";
  }
  img.onload = () => {   // 크기 정보가 없거나 어긋난 경우만 보정
    const w = img.naturalWidth * pxScale() + "px";
    if (img.style.width !== w) {
      img.style.width = w;
      img.style.height = "auto";
    }
  };
  return img;
}

function missingEl(kind) {
  const reason = kind === "injected" && detail.injected_reason
    ? detail.injected_reason : `(${kind} 이미지 없음)`;
  const div = el("div", "", reason);
  // 비교 레이아웃에서 구석에 찌그러지지 않게 패널 형태로
  div.style.cssText = "min-width:180px;padding:14px;background:var(--panel);" +
                      "border:1px solid var(--line);color:var(--dim);" +
                      "white-space:nowrap";
  return div;
}

function imgOrMissing(kind) {
  return detail.images[kind] ? imgEl(kind) : missingEl(kind);
}

function captioned(kind, label) {
  const wrap = el("div");
  wrap.appendChild(el("div", "cap", label));
  const inner = el("div");
  inner.style.position = "relative";
  inner.style.display = "inline-block";
  inner.appendChild(imgOrMissing(kind));
  wrap.appendChild(inner);
  return [wrap, inner];
}

function renderStage() {
  const stage = document.getElementById("stage");
  stage.textContent = "";
  if (!detail) return;

  let boxHost = stage;                 // 상자 오버레이를 얹을 컨테이너
  if (compare === "overlay") {
    // 겹쳐보기 3구간 — 왼쪽: 원본만 / 중간: 원본+글자 레이어(잉크만) 겹침 /
    // 오른쪽: injected 완전 교체. 글자 레이어는 배경 없이 렌더한 한글이라
    // 불투명 영역(널빤지 등)에서도 원문과 한글이 같이 보인다.
    const baseEl = imgOrMissing("original");
    baseEl.id = "overlayBase";
    stage.appendChild(baseEl);
    if (detail.images.injected) {
      for (const [id, textLayer] of [["overlayText", true],
                                     ["overlayFull", false]]) {
        const layer = imgEl("injected", textLayer);
        layer.id = id;
        layer.style.position = "absolute";
        layer.style.left = "0";
        layer.style.top = "0";
        stage.appendChild(layer);
      }
      applyOverlayAlpha();
    }
  } else if (compare === "v" || compare === "h") {
    const row = el("div");
    row.style.display = "flex";
    row.style.flexDirection = compare === "v" ? "column" : "row";
    row.style.gap = "14px";
    row.style.alignItems = "flex-start";
    const [wrapA, innerA] = captioned("original", "원본");
    const [wrapB] = captioned("injected", "injected");
    row.appendChild(wrapA);
    row.appendChild(wrapB);
    stage.appendChild(row);
    boxHost = innerA;                  // 상자는 원본 쪽에만
  } else {
    stage.appendChild(imgOrMissing(BASES[base]));
  }

  if (typeof saveState === "function") saveState();

  // 상자 오버레이 — 어느 베이스 위에도 겹칠 수 있는 독립 토글
  for (const row of detail.rows) {
    const id = row.box_id;
    if (overlays["crop-box"]) {
      const crop = rowRect(row, "crop");
      const src = rowRect(row, "source");
      if (src) boxHost.appendChild(boxDiv("src", src, "", () => select(id)));
      if (crop) {
        const div = boxDiv("crop", crop, id, () => select(id));
        if (selected === id) {
          div.classList.add("sel");
          addHandles(div, "crop", crop, id);
        }
        boxHost.appendChild(div);
      }
    }
    if (overlays["text-box"]) {
      const text = rowRect(row, "text");
      if (text) {
        const problem = row._problem;
        const label = problem
          ? id + " ⚠" + problem
          : id + " " + (row.style || "");
        const div = boxDiv(problem ? "text err" : "text", text, label,
                           () => select(id));
        // 상자별 틸트 각도를 미리보기로 (렌더는 PIL CCW, CSS 는 -angle)
        const ang = (detail.raw[id] && detail.raw[id].angle) || 0;
        if (ang) {
          div.style.transformOrigin = "center";
          div.style.transform = "rotate(" + (-ang) + "deg)";
        }
        if (selected === id) {
          if (!overlays["crop-box"]) div.classList.add("sel");
          addHandles(div, "text", text, id);
        }
        boxHost.appendChild(div);
      }
    }
    // 토글을 켜지 않아도 박스 영역을 직접 클릭하면 선택되게 — 투명 히트 영역.
    // (crop 우선, 없으면 text) 토글이 켜져 있으면 위의 박스가 클릭을 처리한다.
    if (!overlays["crop-box"] && !overlays["text-box"]) {
      const rect = rowRect(row, "crop") || rowRect(row, "text");
      if (rect) {
        const hit = boxDiv(selected === id ? "hit sel" : "hit", rect, "",
                           () => select(id));
        boxHost.appendChild(hit);
      }
    }
  }
}

function select(id) { selected = id; renderStage(); renderProps(); }

// ---- 스타일 인라인 편집 (변경 즉시 미리보기, 저장 버튼으로 원장 기록) ----
let styleEdits = {};            // {스타일명: {키: 입력 문자열}} — 저장 전
let stylePreviewTimer = null;
let renderEpoch = 0;            // 이미지 URL 버전 (openFile 마다 증가)

function schedulePreview() {
  clearTimeout(stylePreviewTimer);
  stylePreviewTimer = setTimeout(renderStage, 250);
}

// 스타일의 기본 필드 — 새 스타일이라 값이 아직 없어도 이 행들은 항상 보인다.
// [키, 힌트(placeholder)]. render.py 가 실제로 읽는 키와 이름을 맞춘다.
const BASIC_STYLE_FIELDS = [
  ["font_family_ko", "글꼴 패밀리 (예: IBM Plex Sans KR)"],
  ["font_weight",    "굵기 (400 / 500 / 600)"],
  ["font_size_px",   "글자 크기 px"],
  ["text_align",     "[가로 l/m/r][세로 t/m/b] (예: mm)"],
  ["fill_rgb",       "글자색 #RRGGBB (또는 #RRGGBBAA = 알파)"],
];
// 선택 필드 — 기본으로는 안 보이고, '＋키 추가' 드롭다운으로 넣는다.
// 값을 안 넣으면 각자의 기본(font_style=regular, orientation=가로)이 쓰인다.
const OPTIONAL_STYLE_FIELDS = [
  ["font_style",        "regular | italic (기본 regular)"],
  ["orientation",       "가로 | vertical (기본 가로쓰기)"],
  ["line_height",       "세로쓰기 줄 간격 = size 배수 (예: 1.3, 0=기본)"],
  ["outline_rgb",       "외곽선색 #RRGGBB"],
  ["outline_weight_px", "외곽선 두께 px"],
  ["effect",            "그림자(drop_shadow) — dx·dy·blur·color 4칸"],
  ["offset_x",          "가로 이동 px"],
  ["offset_y",          "세로 이동 px"],
  ["distribute",        "상자 폭 균등 분배 (true/false)"],
  ["squeeze_min",       "가로 압축 하한 0~1"],
  ["crop_size",         "[w,h] — crop 크기 (행 crop 은 [x,y]만 둘 때)"],
  ["pad",               '{"l","t","r","b"} px — crop 에서 text 상자 파생'],
  ["base",              "상속할 스타일명"],
];
const ALL_STYLE_FIELDS = [...BASIC_STYLE_FIELDS, ...OPTIONAL_STYLE_FIELDS];
const STYLE_HINTS = Object.fromEntries(ALL_STYLE_FIELDS);
const DEFAULT_SHADOW = "drop_shadow(dx=2,dy=2,blur=2)";
// '＋키 추가' 로 넣을 때 미리 채워줄 프리셋 (없는 키는 빈 값으로 열림)
const STYLE_KEY_PRESETS = { effect: DEFAULT_SHADOW };
// 사용자가 드롭다운으로 드러낸(아직 값은 없는) 선택 키 — 스타일명별
const styleExtraKeys = {};
// 스타일명 → 저장/되돌리기 버튼 dirty 표시를 다시 칠하는 함수 (라이브 갱신)
const styleDirtyRefreshers = {};

// 툴 버튼(저장·되돌리기 등)의 하이라이트 on/off
function setToolActive(btn, active) {
  if (!btn) return;
  btn.className = active ? "on" : "";
  btn.style.borderColor = active ? "var(--accent)" : "var(--line)";
}

// 스타일 편집값 반영 — 원래 값과 같아지면 편집을 지워(하이라이트 off) 준다
function styleEditSet(name, key, val, origStr) {
  if (val === origStr) {
    if (styleEdits[name]) {
      delete styleEdits[name][key];
      if (!Object.keys(styleEdits[name]).length) delete styleEdits[name];
    }
  } else {
    (styleEdits[name] = styleEdits[name] || {})[key] = val;
  }
  if (styleDirtyRefreshers[name]) styleDirtyRefreshers[name]();
}

function styleValueInput(name, key, value) {
  const input = document.createElement("input");
  const origStr = (typeof value === "object" && value !== null
       ? JSON.stringify(value) : String(value ?? ""));
  const pending = styleEdits[name] && key in styleEdits[name];
  input.value = pending ? styleEdits[name][key] : origStr;
  input.placeholder = STYLE_HINTS[key] || "";
  const dirty = input.value !== origStr;   // 원래 값과 다를 때만 하이라이트
  input.style.cssText =
    "width:100%;box-sizing:border-box;background:#10151d;border:1px solid " +
    (dirty ? "var(--accent)" : "var(--line)") +
    ";color:var(--fg);padding:1px 4px;font:inherit";
  input.oninput = () => {
    styleEditSet(name, key, input.value, origStr);
    input.style.borderColor =
      input.value !== origStr ? "var(--accent)" : "var(--line)";
    schedulePreview();
  };
  return input;
}

// drop_shadow(dx=2,dy=2,blur=2.8,color=#000000A0) 파싱 — 전용 4칸 에디터에서 씀
const SHADOW_RE_JS =
  /^drop_shadow\(dx=(-?\d+),dy=(-?\d+),blur=([0-9.]+)(?:,color=(#[0-9A-Fa-f]{6}(?:[0-9A-Fa-f]{2})?))?\)$/;

// ── 드롭다운 필드 (글꼴·weight·정렬) ────────────────────────────
const TEXT_ALIGN_OPTIONS = [
  ["lt", "왼쪽·위 (lt)"],   ["mt", "가운데·위 (mt)"],   ["rt", "오른쪽·위 (rt)"],
  ["lm", "왼쪽·중앙 (lm)"], ["mm", "가운데·중앙 (mm)"], ["rm", "오른쪽·중앙 (rm)"],
  ["lb", "왼쪽·아래 (lb)"], ["mb", "가운데·아래 (mb)"], ["rb", "오른쪽·아래 (rb)"],
];

// styleEdits 에 얹힌 미저장 값이 있으면 그걸, 없으면 원장 값을 준다
function effStyleVal(name, key, value) {
  return (styleEdits[name] && key in styleEdits[name])
    ? styleEdits[name][key] : String(value ?? "");
}

function styleSelectInput(name, key, value, options, emptyLabel) {
  const sel = document.createElement("select");
  const origStr = String(value ?? "");
  const cur = effStyleVal(name, key, value);
  const dirty = cur !== origStr;         // 원래 값과 다를 때만 하이라이트
  sel.style.cssText =
    "width:100%;box-sizing:border-box;background:#10151d;border:1px solid " +
    (dirty ? "var(--accent)" : "var(--line)") +
    ";color:var(--fg);padding:1px 4px;font:inherit";
  // 첫 옵션은 빈 값(상속/기본) — 라벨 없이 비워 둔다 ("미설정" 같은 표시 안 함)
  const opts = [["", ""],
    ...options.map(o => Array.isArray(o) ? o : [o, o])];
  if (cur && !opts.some(o => o[0] === cur)) opts.push([cur, cur + " (사용자값)"]);
  for (const [ov, ol] of opts) {
    const opt = document.createElement("option");
    opt.value = ov; opt.textContent = ol;
    if (ov === cur) opt.selected = true;
    sel.appendChild(opt);
  }
  sel.onchange = () => {
    styleEditSet(name, key, sel.value, origStr);
    sel.style.borderColor =
      sel.value !== origStr ? "var(--accent)" : "var(--line)";
    schedulePreview();
    if (key === "font_family_ko") renderProps();   // weight 후보 갱신
  };
  return sel;
}

// text_align 3×3 정렬 그리드 — 가로(왼/가운데/오른) × 세로(위/가운데/아래).
// 값은 [가로 l/m/r][세로 t/m/b] (예: lt = 왼쪽·위).
const ALIGN_H = [["l", "왼쪽"], ["m", "가운데"], ["r", "오른쪽"]];
const ALIGN_V = [["t", "위"], ["m", "가운데"], ["b", "아래"]];
function alignGridInput(name, key, value) {
  const origStr = String(value ?? "");
  const cur = effStyleVal(name, key, value);
  let h = "lmr".includes(cur[0] || "") ? cur[0] : "";
  let v = "tmb".includes(cur[1] || "") ? cur[1] : "";
  const wrap = el("div");
  wrap.style.cssText = "display:inline-grid;grid-template-columns:repeat(3,20px);" +
    "grid-template-rows:repeat(3,20px);gap:2px;padding:2px;box-sizing:border-box;" +
    "border:1px solid var(--line)";
  const cells = {};
  const repaint = () => {
    const val = (h && v) ? h + v : "";
    wrap.style.borderColor = val !== origStr ? "var(--accent)" : "var(--line)";
    for (const [hh] of ALIGN_H) for (const [vv] of ALIGN_V) {
      const sel = hh === h && vv === v;
      const c = cells[hh + vv];
      c.style.background = sel ? "var(--accent)" : "#10151d";
      c.firstChild.style.background = sel ? "#0c1420" : "var(--dim)";
    }
  };
  for (const [vv, vn] of ALIGN_V) for (const [hh, hn] of ALIGN_H) {
    const c = el("div");
    c.title = hn + "·" + vn + " (" + hh + vv + ")";
    c.style.cssText = "border:1px solid var(--line);cursor:pointer;display:flex;" +
      "align-items:" + (vv === "t" ? "flex-start" : vv === "b" ? "flex-end" : "center") +
      ";justify-content:" + (hh === "l" ? "flex-start" : hh === "r" ? "flex-end" : "center") +
      ";padding:2px;box-sizing:border-box";
    const dot = el("div");          // 정렬 위치를 점으로 표시
    dot.style.cssText = "width:7px;height:3px;background:var(--dim)";
    c.appendChild(dot);
    c.onclick = () => {
      h = hh; v = vv;
      styleEditSet(name, key, h + v, origStr);
      repaint();
      schedulePreview();
    };
    cells[hh + vv] = c;
    wrap.appendChild(c);
  }
  repaint();
  return wrap;
}

// 키에 따라 드롭다운(글꼴·weight) · 정렬 그리드 · 자유 입력을 고른다
function styleFieldInput(name, key, value, style) {
  const fonts = (typeof detail !== "undefined" && detail && detail.fonts) || {};
  if (key === "font_family_ko")
    return styleSelectInput(name, key, value, Object.keys(fonts));
  if (key === "font_weight") {
    const fam = effStyleVal(name, "font_family_ko", style.font_family_ko);
    let weights = fonts[fam];
    if (!weights || !weights.length) {          // 패밀리 미선택 → weight 합집합
      const all = new Set();
      for (const ws of Object.values(fonts)) (ws || []).forEach(w => all.add(w));
      weights = [...all].sort();
    }
    return styleSelectInput(name, key, value, weights);
  }
  if (key === "text_align")
    return alignGridInput(name, key, value);
  if (key === "font_style")
    return styleSelectInput(name, key, value,
      [["regular", "regular (보통)"], ["italic", "italic (기울임)"]],
      "regular (기본)");
  if (key === "orientation")
    return styleSelectInput(name, key, value,
      [["vertical", "세로쓰기 (vertical)"]], "가로 (기본)");
  return styleValueInput(name, key, value);
}

function editableStyleTable(name, style) {
  const wrap = el("div");
  const t = el("table");
  const shown = new Set();
  // effect(=drop_shadow) 전용 행 — dx·dy·blur·color 가로 4칸, 라벨은 박스 안쪽.
  // 그림자가 아니면(rotate 등) 일반 text 입력으로 되돌린다.
  const addEffectRow = (origVal) => {
    const origStr = String(origVal ?? "");
    const cur = effStyleVal(name, "effect", origVal);
    const m = SHADOW_RE_JS.exec(cur.trim());
    const tr = el("tr");
    const kd = el("td", "k", m ? "drop_shadow" : "effect");
    if (!("effect" in style)) kd.style.color = "var(--dim)";
    tr.appendChild(kd);
    const td = el("td");
    if (!m) {                       // 그림자 아님 → 일반 text
      td.appendChild(styleValueInput(name, "effect", origVal));
      tr.appendChild(td); t.appendChild(tr);
      return;
    }
    const parts = {dx: m[1], dy: m[2], blur: m[3], color: m[4] || ""};
    const compose = () =>
      `drop_shadow(dx=${parts.dx || 0},dy=${parts.dy || 0},` +
      `blur=${parts.blur || 0}` +
      (parts.color ? `,color=${parts.color}` : "") + ")";
    const row = el("div");
    row.style.cssText = "display:flex;gap:3px";
    const boxes = [];
    const paint = (d) => boxes.forEach(b =>
      b.style.borderColor = d ? "var(--accent)" : "var(--line)");
    const mkField = (key, label, ph, grow) => {
      const box = el("div");
      box.style.cssText = "flex:" + (grow || 1) + " 1 0;min-width:0;display:flex;" +
        "align-items:center;gap:3px;background:#10151d;" +
        "border:1px solid var(--line);padding:1px 4px;box-sizing:border-box";
      const lb = el("span", "", label);
      lb.style.cssText = "color:var(--dim);font-size:11px;flex:none";
      const inp = document.createElement("input");
      inp.value = parts[key];
      inp.placeholder = ph || "";
      inp.style.cssText = "flex:1;min-width:0;width:100%;background:none;" +
        "border:none;color:var(--fg);font:inherit;padding:0;outline:none";
      inp.oninput = () => {
        parts[key] = inp.value.trim();
        const val = compose();
        styleEditSet(name, "effect", val, origStr);
        paint(val !== origStr);
        schedulePreview();
      };
      box.appendChild(lb); box.appendChild(inp);
      boxes.push(box);
      return box;
    };
    // dx·dy·blur 는 짧은 숫자라 좁게, color 는 #RRGGBB(AA) 라 넓게
    row.appendChild(mkField("dx", "dx", "0", 1));
    row.appendChild(mkField("dy", "dy", "0", 1));
    row.appendChild(mkField("blur", "blur", "0", 1.2));
    row.appendChild(mkField("color", "color", "#RRGGBB", 3));
    paint(cur.trim() !== origStr.trim());
    td.appendChild(row);
    tr.appendChild(td);
    t.appendChild(tr);
  };
  const addRow = (k, v) => {
    if (k === "effect") { addEffectRow(v); shown.add(k); return; }
    const tr = el("tr");
    const kd = el("td", "k", k);
    if (!(k in style)) kd.style.color = "var(--dim)";   // 아직 미설정 필드
    // 설정된 키엔 삭제(×) — 지우면 상속값/기본으로 복귀. 그리드처럼 클리어가
    // 없는 필드도 이걸로 지운다.
    const isSet = (k in style) ||
      (styleEdits[name] && k in styleEdits[name]) ||
      (styleExtraKeys[name] || []).includes(k);
    if (isSet) {
      const del = el("span", "", " ×");
      del.title = "이 키 삭제 (상속값/기본으로 복귀)";
      del.style.cssText = "cursor:pointer;color:var(--dim);font-weight:bold";
      del.onmouseenter = () => del.style.color = "#ff5340";
      del.onmouseleave = () => del.style.color = "var(--dim)";
      del.onclick = () => {
        if (k in style) (styleEdits[name] = styleEdits[name] || {})[k] = "";
        else {
          if (styleEdits[name]) delete styleEdits[name][k];
          if (styleExtraKeys[name])
            styleExtraKeys[name] = styleExtraKeys[name].filter(x => x !== k);
        }
        renderProps();
      };
      kd.appendChild(del);
    }
    tr.appendChild(kd);
    const td = el("td");
    const input = styleFieldInput(name, k, v, style);
    td.appendChild(input);
    tr.appendChild(td);
    t.appendChild(tr);
    shown.add(k);
  };
  for (const [k, v] of Object.entries(style)) {
    if (k === "name") continue;
    addRow(k, v);
  }
  // 기본 필드는 base 가 없는 스타일에서만 채워 보여준다 — 새 스타일을 바로
  // 채우게. base 로 상속받는 스타일은 부모에서 오므로 강제로 안 띄운다.
  if (!style.base) {
    for (const [k] of BASIC_STYLE_FIELDS) {
      if (!shown.has(k)) addRow(k, style[k] ?? "");
    }
  }
  // 드롭다운으로 드러낸 선택 키 + 미저장 편집이 얹힌 키도 계속 보여준다
  for (const k of (styleExtraKeys[name] || [])) {
    if (!shown.has(k)) addRow(k, style[k] ?? "");
  }
  for (const k of Object.keys(styleEdits[name] || {})) {
    if (!shown.has(k)) addRow(k, style[k] ?? "");
  }
  // ＋키 추가 — 아직 안 보이는 '알려진' 스타일 항목만 드롭다운으로 고른다
  const addable = ALL_STYLE_FIELDS.map(([k]) => k).filter(k => !shown.has(k));
  if (addable.length) {
    const tr = el("tr");
    const kd = el("td", "k", "＋키 추가"); kd.style.color = "var(--dim)";
    tr.appendChild(kd);
    const td = el("td");
    const sel = document.createElement("select");
    sel.style.cssText = "width:100%;box-sizing:border-box;background:none;" +
      "border:1px dashed var(--line);color:var(--dim);padding:1px 4px;font:inherit";
    const ph = document.createElement("option");
    ph.value = ""; ph.textContent = "— 추가할 항목 —";
    sel.appendChild(ph);
    for (const k of addable) {
      const o = document.createElement("option");
      o.value = k;
      o.textContent = STYLE_HINTS[k] ? `${k} — ${STYLE_HINTS[k]}` : k;
      sel.appendChild(o);
    }
    sel.onchange = () => {
      const k = sel.value;
      if (!k) return;
      if (k in STYLE_KEY_PRESETS) {                 // effect 등: 프리셋 값으로
        (styleEdits[name] = styleEdits[name] || {})[k] = STYLE_KEY_PRESETS[k];
      } else {                                      // 그 외: 빈 행만 드러낸다
        styleExtraKeys[name] = styleExtraKeys[name] || [];
        if (!styleExtraKeys[name].includes(k)) styleExtraKeys[name].push(k);
      }
      schedulePreview();
      renderProps();
    };
    td.appendChild(sel);
    tr.appendChild(td);
    t.appendChild(tr);
  }
  wrap.appendChild(t);

  const dirty = !!(styleEdits[name] && Object.keys(styleEdits[name]).length);
  const save = toolButton("💾 저장", async () => {
    const updates = styleEdits[name];
    if (!updates || !Object.keys(updates).length) return;
    busy("스타일 저장 중…");
    const result = await postOp("/api/style/update?path=" +
      encodeURIComponent(detail.file), {name, updates});
    if (result.ok) { delete styleEdits[name]; delete styleExtraKeys[name]; }
    finishOp(result, selected);
  }, dirty);
  save.style.marginTop = "4px";
  wrap.appendChild(save);
  const canRevert = dirty || !!(styleExtraKeys[name] || []).length;
  const revert = toolButton("↩ 되돌리기", () => {
    // 저장 안 한 편집·드러낸 키 폐기 — 원장의 현재 값으로 복귀
    delete styleEdits[name];
    delete styleExtraKeys[name];
    renderStage();
    renderProps();
  }, canRevert);
  revert.style.marginTop = "4px";
  wrap.appendChild(revert);
  // 입력이 바뀔 때마다 저장/되돌리기 하이라이트를 다시 칠한다 (재렌더 없이)
  styleDirtyRefreshers[name] = () => {
    const d = !!(styleEdits[name] && Object.keys(styleEdits[name]).length);
    setToolActive(save, d);
    setToolActive(revert, d || !!(styleExtraKeys[name] || []).length);
  };
  return wrap;
}

function table(obj, skipEmpty = true) {
  const t = el("table");
  for (const [k, v] of Object.entries(obj)) {
    if (skipEmpty && (v === null || v === "" || v === undefined)) continue;
    const tr = el("tr");
    tr.appendChild(el("td", "k", k));
    tr.appendChild(el("td", "",
      typeof v === "object" ? JSON.stringify(v) : String(v)));
    t.appendChild(tr);
  }
  return t;
}

function rectLabel(row, prefix, wh) {
  const ks = wh ? [prefix+"x", prefix+"y", prefix+wh[0], prefix+wh[1]]
               : [prefix+"x", prefix+"y", prefix+"w", prefix+"h"];
  const v = ks.map(k => row[k]);
  return v.every(x => x !== "") ? `${v[0]},${v[1]} ${v[2]}×${v[3]}` : "—";
}

function banner(ok, text) {
  const div = el("div", "", text);
  div.style.cssText = ok
    ? "background:#1e3a26;border:1px solid #3fb950;color:#7ee787;" +
      "padding:8px 10px;margin-bottom:8px"
    : "background:#4a2320;border:1px solid #ff5340;color:#ff8a7a;" +
      "padding:8px 10px;margin-bottom:8px";
  return div;
}

async function reextract() {
  if (!detail) return;
  const file = detail.file;
  if (!confirm(`${file}\n\n이 파일의 상자(ko 미입력)를 지우고 OCR 을 ` +
               `다시 돌립니다. 계속할까요?`)) return;
  const pane = document.getElementById("props");
  pane.textContent = "";
  pane.appendChild(el("div", "empty", "재추출 중… (판독 모델 첫 로드 시 수십 초)"));
  let ok = false, log = "";
  try {
    const res = await fetch("/api/reextract?path=" + encodeURIComponent(file),
                            {method: "POST"});
    const body = await res.json().catch(() => ({}));
    ok = res.ok && body.log !== undefined;
    log = body.log || body.error ||
          `HTTP ${res.status} — 서버가 옛 코드일 수 있습니다 (jaguk gui 재시작)`;
  } catch (error) {
    log = "요청 실패: " + error + " — 서버 재시작(jaguk gui) 후 다시 시도하세요";
  }
  await openFile(file, null);
  const head = banner(ok, ok ? `✅ 재추출 완료 — ${file}` : `❌ 재추출 실패 — ${file}`);
  const pre = el("pre", "", log);
  pre.style.cssText = "white-space:pre-wrap;color:var(--dim);font-size:11px;" +
                      "border:1px solid var(--line);padding:6px;margin:0 0 10px";
  const props = document.getElementById("props");
  props.insertBefore(pre, props.firstChild);
  props.insertBefore(head, props.firstChild);
}

// ---- 박스 편집 ----
let editMode = null;    // null | "add" | "split"

async function postOp(url, body) {
  try {
    const res = await fetch(url, {method: "POST",
      headers: body ? {"Content-Type": "application/json"} : undefined,
      body: body ? JSON.stringify(body) : undefined});
    const data = await res.json().catch(() => ({}));
    let log = data.log || data.error || ("HTTP " + res.status);
    if (!res.ok && (res.status === 501 || res.status === 404))
      log += " — 서버가 옛 코드입니다. jaguk gui 를 재시작(Ctrl+C 후 다시)하세요";
    return {ok: res.ok && data.log !== undefined, log};
  } catch (error) {
    return {ok: false, log: String(error) + " — 서버 재시작 필요할 수 있음"};
  }
}

async function finishOp(result, keepSelected) {
  const file = detail.file;
  const group = currentGroup;
  editMode = null;
  await openFile(file, null, group);    // 그룹 컨텍스트 유지 (공유 base)
  if (keepSelected) {
    selected = keepSelected;
    renderStage();
    renderProps();
  }
  const props = document.getElementById("props");
  props.insertBefore(
    banner(result.ok, (result.ok ? "✅ " : "❌ ") + result.log),
    props.firstChild);
}

async function deleteBox() {
  if (!selected || !confirm(`${selected} 상자를 지울까요?`)) return;
  finishOp(await postOp("/api/box/delete?path=" +
    encodeURIComponent(detail.file) + "&id=" + encodeURIComponent(selected)));
}

async function dropFile() {
  if (!detail) return;
  const file = detail.file;
  if (!confirm(`${file}\n\n이 파일을 제외(drop)합니다 — 모든 상자를 지우고 ` +
               `이후 추출에서도 무시됩니다. 계속할까요?`)) return;
  busy("제외 중…");
  const result = await postOp("/api/drop?path=" + encodeURIComponent(file));
  selected = null;
  detail = null;
  document.getElementById("stage").textContent = "";
  document.getElementById("curfile").textContent = "파일을 선택하세요";
  await loadTree();
  const pane = document.getElementById("props");
  pane.textContent = "";
  pane.appendChild(banner(result.ok, (result.ok ? "✅ " : "❌ ") + result.log));
}

function toolButton(label, onclick, active) {
  const b = el("button", active ? "on" : "", label);
  b.style.cssText = "margin:0 6px 8px 0;background:none;border:1px solid " +
    (active ? "var(--accent)" : "var(--line)") +
    ";color:var(--fg);padding:3px 10px;cursor:pointer";
  b.onclick = onclick;
  return b;
}

function renderRecompose(pane) {
  // 원장 recompose 스펙이 있는 파일 — 재조합 정보를 스탯으로 보여준다
  if (!detail || !detail.recompose) return;
  const rc = detail.recompose;
  pane.appendChild(el("h3", "", "🧩 리컴포지트"));
  const t = el("table");
  const kv = (k, v) => {
    const tr = el("tr");
    tr.appendChild(el("td", "k", k));
    tr.appendChild(el("td", "", v));
    t.appendChild(tr);
  };
  kv("네이티브", rc.canvas.join(" × "));
  kv("작업 캔버스", rc.to.join(" × "));
  rc.moves.forEach((m, i) =>
    kv(`조각 ${i + 1}`, `(${m[0]}, ${m[1]}) ${m[2]}×${m[3]} → (${m[4]}, ${m[5]})`));
  pane.appendChild(t);
}

function renderPost(pane) {
  // 파일 단위 후처리(post) — 글자 위에 레이어를 다시 덮는 overlay 등
  if (!detail || !detail.post || !detail.post.length) return;
  pane.appendChild(el("h3", "", "🖼 후처리 (post)"));
  for (const p of detail.post) {
    const t = el("table");
    const kv = (k, v) => {
      if (v === undefined || v === null || v === "") return;
      const tr = el("tr");
      tr.appendChild(el("td", "k", k));
      tr.appendChild(el("td", "", String(v)));
      t.appendChild(tr);
    };
    kv("op", p.op);
    kv("layer", p.layer);
    kv("alpha", p.alpha !== undefined ? p.alpha + " / 255" : "255 (기본)");
    kv("alpha_white", p.alpha_white !== undefined
                      ? p.alpha_white + " / 255 (순백 픽셀)" : undefined);
    kv("note", p.note);
    pane.appendChild(t);
  }
}

function renderBoxList(pane) {
  pane.appendChild(toolButton("🔄 박스 지우고 OCR 다시", reextract));
  pane.appendChild(toolButton(
    editMode === "add" ? "➕ 드래그로 상자를 그리세요…" : "➕ 박스 추가",
    () => { editMode = editMode === "add" ? null : "add";
            renderStage(); renderProps(); },
    editMode === "add"));
  pane.appendChild(toolButton("🚫 파일 제외", dropFile));
  renderRecompose(pane);
  renderPost(pane);
  // 파일 선택 직후 — crop/text 상자 목록. 항목 클릭 = 상자 선택
  pane.appendChild(el("h3", "", `상자 목록 (${detail.rows.length}행)`));
  const t = el("table");
  const head = el("tr");
  for (const h of ["id", "원문 jp", "번역 ko"]) {
    head.appendChild(el("td", "k", h));
  }
  t.appendChild(head);
  for (const row of detail.rows) {
    const tr = el("tr");
    tr.style.cursor = "pointer";
    tr.onmouseenter = () => tr.style.background = "#262a33";
    tr.onmouseleave = () => tr.style.background = "";
    tr.onclick = () => select(row.box_id);
    const ko = row.ko_text || (row._problem ? "⚠" + row._problem : "");
    const cells = [row.box_id, row.jp_text || "—", ko];
    cells.forEach((value, index) => {
      const td = el("td", "", value);
      if (index === 2 && row._problem) td.style.color = "#ff8a7a";
      if (index === 2 && !row._problem) td.style.color = "var(--accent)";
      tr.appendChild(td);
    });
    t.appendChild(tr);
  }
  pane.appendChild(t);
}

function renderProps() {
  const pane = document.getElementById("props");
  pane.textContent = "";
  if (!detail) {
    pane.appendChild(el("div", "empty", "파일을 선택하세요."));
    return;
  }
  if (!selected) {
    if (detail.rows.length) {
      renderBoxList(pane);
    } else {
      pane.appendChild(toolButton("🔄 박스 지우고 OCR 다시", reextract));
      pane.appendChild(toolButton("🚫 파일 제외", dropFile));
      renderRecompose(pane);
      renderPost(pane);
      pane.appendChild(el("div", "empty", "이 파일에는 행이 없습니다."));
    }
    return;
  }
  const row = detail.rows.find(r => r.box_id === selected);
  if (!row) return;

  const back = el("button", "", "← 목록");
  back.style.cssText = "margin:0 6px 8px 0;background:none;border:1px solid " +
                       "var(--line);color:var(--dim);padding:2px 8px;cursor:pointer";
  back.onclick = () => { selected = null; renderStage(); renderProps(); };
  pane.appendChild(back);
  pane.appendChild(toolButton("🗑 지우기", deleteBox));
  pane.appendChild(toolButton("🔁 이 박스만 다시 읽기", async () => {
    const id = selected;
    busy("재판독 중…");
    finishOp(await postOp("/api/box/reread?path=" +
      encodeURIComponent(detail.file) + "&id=" + encodeURIComponent(id)), id);
  }));
  pane.appendChild(toolButton(
    editMode === "split" ? "✂ 나눌 위치를 클릭하세요…" : "✂ 나누기",
    () => { editMode = editMode === "split" ? null : "split";
            renderStage(); renderProps(); },
    editMode === "split"));

  if (row._problem) {
    const banner = el("div", "", "⚠ " + row._problem);
    banner.style.cssText =
      "background:#4a2320;border:1px solid #ff5340;padding:6px 8px;" +
      "margin-bottom:10px;color:#ff8a7a";
    pane.appendChild(banner);
  }

  // 스타일 지정 — 원장의 스타일 중에서 고른다 (선택 즉시 저장)
  const isCatalogRow = !!row.catalog;
  const styleRow = el("div");
  styleRow.style.cssText = "margin:2px 0 8px;display:flex;gap:6px;" +
                           "align-items:center";
  styleRow.appendChild(el("span", "k", "스타일"));
  const sel = document.createElement("select");
  sel.style.cssText = "flex:1;background:#10151d;border:1px solid var(--line);" +
                      "color:var(--fg);padding:2px 4px;font:inherit";
  const noneOpt = document.createElement("option");
  noneOpt.value = ""; noneOpt.textContent = "(없음)";
  sel.appendChild(noneOpt);
  const labelFor = n => n + (detail.styles[n].label
                             ? " — " + detail.styles[n].label : "");
  for (const name of Object.keys(detail.styles).sort()) {
    const o = document.createElement("option");
    o.value = name;
    o.textContent = name;              // 닫힘 표시는 이름만
    o.title = labelFor(name);
    sel.appendChild(o);
  }
  // 펼치면 라벨까지, 닫으면 이름만 — select 는 선택된 option 의 텍스트를
  // 그대로 보여주므로 focus/blur 에서 텍스트를 바꿔치기한다
  const expand = () => { for (const o of sel.options)
    if (o.value) o.textContent = labelFor(o.value); };
  const collapse = () => { for (const o of sel.options)
    if (o.value) o.textContent = o.value; };
  sel.onfocus = expand;
  sel.onblur = collapse;
  sel.value = row.style || "";
  sel.onchange = async () => {
    collapse();
    const id = selected;
    busy("스타일 지정 변경 중…");
    finishOp(await postOp("/api/box/style?path=" +
      encodeURIComponent(detail.file) + "&id=" + encodeURIComponent(id),
      {style: sel.value}), id);
  };
  styleRow.appendChild(sel);
  // ＋ 새 스타일 추가
  const addStyleBtn = el("button", "", "＋새 스타일");
  addStyleBtn.style.cssText = "background:none;border:1px solid var(--line);" +
    "color:var(--dim);padding:2px 8px;cursor:pointer;white-space:nowrap";
  addStyleBtn.onclick = () => {
    addStyleBtn.style.display = "none";
    const form = el("div");
    form.style.cssText = "display:flex;gap:4px;align-items:center;flex-wrap:" +
      "wrap;margin:4px 0";
    const nameIn = document.createElement("input");
    nameIn.placeholder = "새 스타일 이름";
    nameIn.style.cssText = "background:#10151d;border:1px solid var(--line);" +
      "color:var(--fg);padding:2px 4px;font:inherit;width:120px";
    const baseSel = document.createElement("select");
    baseSel.style.cssText = "background:#10151d;border:1px solid var(--line);" +
      "color:var(--fg);padding:2px 4px;font:inherit";
    const none = document.createElement("option");
    none.value = ""; none.textContent = "상속 없음";
    baseSel.appendChild(none);
    for (const n of Object.keys(detail.styles).sort()) {
      const o = document.createElement("option");
      o.value = n; o.textContent = "↳ " + n;
      baseSel.appendChild(o);
    }
    const addOk = el("button", "", "추가");
    addOk.style.cssText = "background:none;border:1px solid var(--accent);" +
      "color:var(--fg);padding:2px 8px;cursor:pointer";
    const addCancel = el("button", "", "취소");
    addCancel.style.cssText = "background:none;border:1px solid var(--line);" +
      "color:var(--dim);padding:2px 8px;cursor:pointer";
    const close = () => { form.remove(); addStyleBtn.style.display = ""; };
    addCancel.onclick = close;
    addOk.onclick = async () => {
      const name = nameIn.value.trim();
      if (!name) { nameIn.focus(); return; }
      busy("스타일 추가 중…");
      const res = await postOp("/api/style/add", {name, base: baseSel.value});
      // 추가한 스타일을 지금 선택된 상자에 바로 지정 (선택돼 있으면)
      if (res.ok && selected)
        await postOp("/api/box/style?path=" + encodeURIComponent(detail.file) +
          "&id=" + encodeURIComponent(selected), {style: name});
      finishOp(res, selected);
    };
    nameIn.onkeydown = (e) => {
      if (e.key === "Enter") addOk.onclick();
      else if (e.key === "Escape") close();
    };
    form.appendChild(nameIn);
    form.appendChild(el("span", "k", "상속"));
    form.appendChild(baseSel);
    form.appendChild(addOk);
    form.appendChild(addCancel);
    styleRow.insertAdjacentElement("afterend", form);
    nameIn.focus();
  };
  styleRow.appendChild(addStyleBtn);
  pane.appendChild(styleRow);

  // 원문(jp)·번역문(ko) 표시 + ✏️ 편집 버튼으로 둘 다 편집 (원문도 정정 가능)
  {
    const koWrap = el("div");
    koWrap.style.cssText = "margin:2px 0 10px";
    const rawRow = detail.raw[selected];
    const koVal = (isCatalogRow ? (detail.entry && detail.entry.ko)
                                : (rawRow && rawRow.ko)) || "";
    const jpVal = (rawRow && rawRow.jp) || row.jp_text || "";

    // 표시부 — 원문 / 번역문 (값 없으면 흐리게 "(없음)")
    const dispLine = (label, val) => {
      const d = el("div");
      d.style.cssText = "display:flex;gap:8px;margin:1px 0";
      const k = el("span", "k", label);
      k.style.cssText = "flex:none;min-width:48px";
      const v = el("span", "", val || "(없음)");
      v.style.whiteSpace = "pre-line";   // 두 줄 번역문의 줄바꿈이 보이게
      if (!val) v.style.color = "var(--dim)";
      d.appendChild(k); d.appendChild(v);
      return d;
    };
    koWrap.appendChild(dispLine("원문", jpVal));
    koWrap.appendChild(dispLine("번역문", koVal));

    // 편집창 (기본 숨김) — 원문 jp + 번역문 ko 각각 textarea
    const editor = el("div");
    editor.style.cssText = "display:none;margin-top:4px";
    const mkField = (label, val) => {
      const w = el("div"); w.style.marginBottom = "5px";
      w.appendChild(el("span", "k", label));
      const t = document.createElement("textarea");
      t.style.cssText = "width:100%;min-height:38px;background:#10151d;border:" +
        "1px solid var(--line);color:var(--fg);padding:4px;font:inherit;" +
        "box-sizing:border-box;resize:vertical;margin-top:2px";
      t.value = val;
      w.appendChild(t);
      return [w, t];
    };
    const [jpW, jpTa] = mkField("원문 jp", jpVal);
    const [koW, ta] = mkField("번역문 ko", koVal);
    const saveBtn = el("button", "", "💾 저장 (Ctrl+Enter)");
    saveBtn.style.cssText = "margin:2px 6px 0 0;background:none;border:1px solid " +
      "var(--line);color:var(--fg);padding:2px 10px;cursor:pointer";
    const doSave = async () => {
      const id = selected, f = encodeURIComponent(detail.file);
      busy("저장 중…");
      let res = null;
      if (jpTa.value !== jpVal)
        res = await postOp("/api/box/jp?path=" + f + "&id=" +
          encodeURIComponent(id), {jp: jpTa.value});
      if (ta.value !== koVal)
        res = await postOp("/api/box/ko?path=" + f + "&id=" +
          encodeURIComponent(id), {ko: ta.value});
      finishOp(res || {ok: true, log: "변경 없음"}, id);
    };
    saveBtn.onclick = doSave;
    const onKey = (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault(); doSave();
      }
    };
    const dirty = () => setToolActive(saveBtn,
      jpTa.value !== jpVal || ta.value !== koVal);
    jpTa.onkeydown = onKey; ta.onkeydown = onKey;
    jpTa.oninput = dirty;   ta.oninput = dirty;
    const editBtn = el("button", "", jpVal || koVal ? "✏️ 편집" : "✏️ 입력");
    editBtn.style.cssText = "margin-top:3px;background:none;border:1px solid " +
      "var(--line);color:var(--fg);padding:2px 10px;cursor:pointer";
    const cancel = el("button", "", "취소");
    cancel.style.cssText = saveBtn.style.cssText;
    cancel.onclick = () => {
      jpTa.value = jpVal; ta.value = koVal; setToolActive(saveBtn, false);
      editor.style.display = "none"; editBtn.style.display = "";
    };
    editBtn.onclick = () => {
      editBtn.style.display = "none"; editor.style.display = "";
      ta.focus();
    };
    editor.appendChild(jpW);
    editor.appendChild(koW);
    editor.appendChild(saveBtn);
    editor.appendChild(cancel);
    koWrap.appendChild(editBtn);
    koWrap.appendChild(editor);
    pane.appendChild(koWrap);
  }

  // ① inline — 일반 행이면 구조형 행, text-only 항목이면 entry
  pane.appendChild(el("h3", "", "Inline — " + selected));
  if (isCatalogRow && detail.entry) {
    pane.appendChild(table(detail.entry));
  } else if (detail.raw[selected]) {
    pane.appendChild(table(detail.raw[selected]));
  } else {
    pane.appendChild(table(row));
  }

  // ①′ 해석 결과 — 슬롯·스타일(crop_size/pad)·용어표 파생이 끝난 렌더 입력값.
  // Inline 은 "기록"이고 이것이 실제로 그려지는 값이다.
  {
    const raw = detail.raw[selected];
    const inlineKo = isCatalogRow ? (detail.entry && detail.entry.ko)
                                  : (raw && raw.ko);
    const t = el("table");
    const kv = (k, v) => {
      if (v === undefined || v === null || v === "" || v === "—") return;
      const tr = el("tr");
      tr.appendChild(el("td", "k", k));
      tr.appendChild(el("td", "", String(v)));
      t.appendChild(tr);
    };
    kv("원문 jp", row.jp_text);
    kv("번역 ko", row.ko_text &&
       row.ko_text + (!inlineKo ? "   ← terms(용어표)" : ""));
    kv("text", rectLabel(row, "text_"));
    kv("crop", rectLabel(row, "crop_"));
    kv("source", rectLabel(row, "source_", ["box_w", "box_h"]));
    kv("style", row.style);
    kv("opacity", row.opacity !== "FF" ? row.opacity : undefined);
    kv("overflow", row.overflow);
    kv("slot", row.slot);
    kv("base", row.base);
    kv("canvas", row.canvas_w ? `${row.canvas_w} × ${row.canvas_h}` : undefined);
    pane.appendChild(el("h3", "", "해석 결과 (렌더 입력)"));
    pane.appendChild(t);
  }

  // ② text-only 묶음 기본값 (해당하면)
  if (isCatalogRow && detail.catalog) {
    pane.appendChild(el("h3", "", "Catalog — " + detail.catalog.name));
    pane.appendChild(table(detail.catalog));
  }

  // ③ style — base 사슬을 따라 상위 style 을 아래로 계속 표시.
  // 값은 바로 편집 가능: 바꾸면 미리보기 즉시 반영, 💾 저장으로 원장 기록
  let styleName = row.style;
  const seen = new Set();
  while (styleName && detail.styles[styleName] && !seen.has(styleName)) {
    seen.add(styleName);
    const style = detail.styles[styleName];
    pane.appendChild(el("h3", "",
      (seen.size === 1 ? "Style — " : "상위 Style — ") + styleName));
    pane.appendChild(editableStyleTable(styleName, style));
    styleName = style.base;
  }

  // ④ 규칙 (파일 단위)
  if (detail.rule && Object.keys(detail.rule).length) {
    pane.appendChild(el("h3", "", "규칙 (set)"));
    pane.appendChild(table(detail.rule));
  }
}

// ---- 리사이즈/이동 핸들 (선택된 상자) ----
let resizing = null;   // {id, key, handle, start, orig, div}

const HANDLE_DEFS = [
  ["nw", "nwse-resize", 0, 0], ["n", "ns-resize", .5, 0],
  ["ne", "nesw-resize", 1, 0], ["e", "ew-resize", 1, .5],
  ["se", "nwse-resize", 1, 1], ["s", "ns-resize", .5, 1],
  ["sw", "nesw-resize", 0, 1], ["w", "ew-resize", 0, .5]];

function addHandles(div, key, rect, id) {
  if (editMode) return;                 // add/split 모드 중엔 핸들 비활성
  for (const [name, cursor, fx, fy] of HANDLE_DEFS) {
    const h = el("div", "handle");
    h.style.cursor = cursor;
    h.style.left = `calc(${fx * 100}% - 4px)`;
    h.style.top = `calc(${fy * 100}% - 4px)`;
    h.onmousedown = ev => {
      ev.stopPropagation();
      ev.preventDefault();
      resizing = {id, key, handle: name, start: [ev.clientX, ev.clientY],
                  orig: rect.slice(), cur: null, div};
    };
    div.appendChild(h);
  }
  // 틸트(회전) 핸들 — text 상자 상단 중앙 위로 나온 원. 드래그로 기울인다.
  if (key === "text") {
    const rot = el("div", "handle rot");
    rot.title = "드래그: 틸트(회전) · 더블클릭: 0°";
    rot.style.cursor = "grab";
    rot.style.left = "calc(50% - 5px)";
    rot.style.top = "-20px";
    rot.style.borderRadius = "50%";
    rot.onmousedown = ev => {
      ev.stopPropagation();
      ev.preventDefault();
      const b = div.getBoundingClientRect();
      const cx = b.left + b.width / 2, cy = b.top + b.height / 2;
      const startA = Math.atan2(ev.clientY - cy, ev.clientX - cx) * 180 / Math.PI;
      const cur = (detail.raw[id] && detail.raw[id].angle) || 0;
      resizing = {id, key, handle: "rotate", start: [ev.clientX, ev.clientY],
                  center: [cx, cy], startA, origAngle: cur, cur: null, div};
    };
    rot.ondblclick = async ev => {          // 더블클릭 = 각도 0 으로
      ev.stopPropagation();
      busy("틸트 초기화…");
      finishOp(await postOp("/api/box/angle?path=" +
        encodeURIComponent(detail.file) + "&id=" + encodeURIComponent(id),
        {angle: 0}), id);
    };
    div.appendChild(rot);
  }
  div.style.cursor = "move";            // 본체 드래그 = 이동
  div.onmousedown = ev => {
    if (ev.target !== div) return;
    ev.stopPropagation();
    ev.preventDefault();
    resizing = {id, key, handle: "move", start: [ev.clientX, ev.clientY],
                orig: rect.slice(), cur: null, div};
  };
}

window.addEventListener("mousemove", ev => {
  if (!resizing) return;
  if (resizing.handle === "rotate") {       // 틸트 드래그
    const [cx, cy] = resizing.center;
    const a = Math.atan2(ev.clientY - cy, ev.clientX - cx) * 180 / Math.PI;
    const newA = resizing.origAngle - (a - resizing.startA);
    resizing.cur = Math.round(newA * 10) / 10;
    resizing.div.style.transformOrigin = "center";
    resizing.div.style.transform = "rotate(" + (-resizing.cur) + "deg)";
    return;
  }
  const s = pxScale();
  const dx = Math.round((ev.clientX - resizing.start[0]) / s);
  const dy = Math.round((ev.clientY - resizing.start[1]) / s);
  let [x, y, w, h] = resizing.orig;
  const hd = resizing.handle;
  if (hd === "move") {
    x += dx; y += dy;
  } else {
    if (hd.includes("w")) { x += dx; w -= dx; }
    if (hd.includes("e")) { w += dx; }
    if (hd.includes("n")) { y += dy; h -= dy; }
    if (hd.includes("s")) { h += dy; }
  }
  if (w < 2 || h < 2) return;
  resizing.cur = [x, y, w, h];
  resizing.div.style.left = x * s + "px";
  resizing.div.style.top = y * s + "px";
  resizing.div.style.width = w * s + "px";
  resizing.div.style.height = h * s + "px";
});

window.addEventListener("mouseup", async () => {
  if (!resizing) return;
  const r = resizing;
  resizing = null;
  if (r.handle === "rotate") {              // 틸트 저장
    if (r.cur === null || r.cur === r.origAngle) return;
    busy("틸트 저장 중…");
    finishOp(await postOp("/api/box/angle?path=" +
      encodeURIComponent(detail.file) + "&id=" + encodeURIComponent(r.id),
      {angle: r.cur}), r.id);
    return;
  }
  if (!r.cur || String(r.cur) === String(r.orig)) return;
  busy("상자 저장 중…");
  const res = await postOp("/api/box/update?path=" +
    encodeURIComponent(detail.file) + "&id=" + encodeURIComponent(r.id),
    {key: r.key, rect: r.cur, sync: syncBoxes});
  // source(원문 영역)를 고쳤으면 그 박스만 자동 재판독 — 변경분만 업데이트
  if (res.ok && r.key === "source") {
    const rr = await postOp("/api/box/reread?path=" +
      encodeURIComponent(detail.file) + "&id=" + encodeURIComponent(r.id));
    res.log += " · " + rr.log;
  }
  finishOp(res, r.id);
});

// ---- 스테이지 편집 상호작용 (add 드래그 / split 클릭) ----
const stageEl = document.getElementById("stage");
let dragStart = null, dragDiv = null, splitGuide = null;
let pendingMove = null;                  // rAF 스로틀 — 리플로우 폭주 방지

function stagePos(ev) {
  const r = stageEl.getBoundingClientRect();
  const s = pxScale();
  return [Math.round((ev.clientX - r.left) / s),
          Math.round((ev.clientY - r.top) / s)];
}

function busy(text) {
  const pane = document.getElementById("props");
  pane.textContent = "";
  pane.appendChild(el("div", "empty", text));
}

stageEl.addEventListener("mousedown", ev => {
  if (editMode !== "add" || !detail) return;
  ev.preventDefault();
  dragStart = stagePos(ev);
  dragDiv = el("div", "box text");
  dragDiv.style.borderColor = "var(--accent)";
  stageEl.appendChild(dragDiv);
});

function onMove(ev) {
  if (pendingMove) { pendingMove.ev = ev; return; }
  pendingMove = {ev};
  requestAnimationFrame(() => {
    const e = pendingMove.ev;
    pendingMove = null;
    const s = pxScale();
    if (dragDiv && dragStart) {
      const [x, y] = stagePos(e);
      dragDiv.style.left = Math.min(dragStart[0], x) * s + "px";
      dragDiv.style.top = Math.min(dragStart[1], y) * s + "px";
      dragDiv.style.width = Math.abs(x - dragStart[0]) * s + "px";
      dragDiv.style.height = Math.abs(y - dragStart[1]) * s + "px";
    }
    if (editMode === "split" && selected) {
      if (!splitGuide) {
        splitGuide = el("div");
        // transform 만 갱신 — 레이아웃 재계산 없이 60fps 로 따라온다
        splitGuide.style.cssText =
          "position:absolute;top:0;bottom:0;width:1px;background:var(--accent);" +
          "pointer-events:none;will-change:transform";
        stageEl.appendChild(splitGuide);
      }
      const r = stageEl.getBoundingClientRect();
      splitGuide.style.transform =
        `translateX(${e.clientX - r.left}px)`;
    } else if (splitGuide) {
      splitGuide.remove();
      splitGuide = null;
    }
  });
}
stageEl.addEventListener("mousemove", onMove);
stageEl.addEventListener("mouseleave", () => {
  if (splitGuide) { splitGuide.remove(); splitGuide = null; }
});

// 스테이지 밖에서 마우스를 놓아도 임시 상자가 남지 않게 (버벅임 원인)
window.addEventListener("mouseup", ev => {
  if (!dragDiv) return;
  const [x, y] = stagePos(ev);
  const rect = [Math.min(dragStart[0], x), Math.min(dragStart[1], y),
                Math.abs(x - dragStart[0]), Math.abs(y - dragStart[1])];
  dragDiv.remove();
  dragDiv = null;
  dragStart = null;
  if (rect[2] < 3 || rect[3] < 3) return;      // 너무 작으면 취소
  busy("상자 추가 중… (원문 판독 포함)");
  postOp("/api/box/add?path=" + encodeURIComponent(detail.file),
         {rect, sync: syncBoxes})
    .then(finishOp);
});

// split — 캡처 단계에서 가로챈다 (상자 자체의 클릭 핸들러보다 먼저)
stageEl.addEventListener("click", ev => {
  if (editMode !== "split" || !selected || !detail) return;
  ev.stopPropagation();
  ev.preventDefault();
  const [x] = stagePos(ev);
  const id = selected;
  if (splitGuide) { splitGuide.remove(); splitGuide = null; }
  busy("나누는 중… (반쪽별 원문 재판독 포함, 수 초)");
  postOp("/api/box/split?path=" + encodeURIComponent(detail.file) +
         "&id=" + encodeURIComponent(id), {at: x}).then(finishOp);
}, true);

// ---- 상태 유지 — 새로고침해도 파일·배율·배경·메뉴 선택이 남는다 ----
const STORE_KEY = "jaguk-gui-state";

function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      base, overlays, compare, overlayAlpha, zoom, bgIndex, bgCustom,
      file: detail ? detail.file : null,
    }));
  } catch (e) { /* localStorage 불가 환경 — 상태 유지만 포기 */ }
}

function restoreState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (!s) return null;
    if (s.base in BASES) base = s.base;
    if (s.overlays)
      for (const k of Object.keys(overlays))
        if (typeof s.overlays[k] === "boolean") overlays[k] = s.overlays[k];
    if (Object.values(COMPARE).includes(s.compare) || s.compare === "")
      compare = s.compare;
    if (typeof s.overlayAlpha === "number") overlayAlpha = s.overlayAlpha;
    if (typeof s.zoom === "number") zoom = Math.min(8, Math.max(0.25, s.zoom));
    if (Number.isInteger(s.bgIndex) && s.bgIndex >= 0 && s.bgIndex <= 3)
      bgIndex = s.bgIndex;
    if (typeof s.bgCustom === "string") bgCustom = s.bgCustom;
    return typeof s.file === "string" ? s.file : null;
  } catch (e) {
    return null;
  }
}

const restoredFile = restoreState();
renderModes();
renderBgButtons();
applyBg();
loadTree().then(() => {
  if (!restoredFile) return;
  // 트리에서 해당 항목을 찾아 선택 표시까지 복원
  const item = document.querySelector(
    `#tree .item[data-file="${CSS.escape(restoredFile)}"]`);
  openFile(restoredFile, item);
});
// OS 배율·브라우저 줌 변경 시 devicePixelRatio 가 바뀐다 — 픽셀 정합 재계산
window.addEventListener("resize", () => { if (detail) renderStage(); });
</script>
